# fly.toml app configuration file generated for feedstack on 2026-05-08T22:32:57-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'feedstack'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.health]
    grace_period = "90s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
  
[[mounts]]
     source = "djl_cache"
     destination = "/data"
     initial_size = "1gb"