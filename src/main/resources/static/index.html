<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>feedstack — engineering blog search</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">feedstack</h1>
        <p class="tagline">Search 13,000+ engineering blog posts from 400+ companies</p>
        <p class="stats-strip" id="stats-strip">loading corpus…</p>
        <form id="search-form" class="search-form" role="search" autocomplete="off">
          <input
            id="search-input"
            type="search"
            class="search-input"
            placeholder="raft consensus, BM25, kubernetes networking…"
            autofocus
            spellcheck="false"
          />
        </form>
        <div class="topic-chips" id="topic-chips">
          <button class="chip" data-query="distributed systems consensus">Distributed Systems</button>
          <button class="chip" data-query="database internals storage engine">Database Internals</button>
          <button class="chip" data-query="ML infrastructure training serving">ML Infrastructure</button>
          <button class="chip" data-query="rust systems programming">Rust &amp; Systems</button>
          <button class="chip" data-query="kubernetes container orchestration">Kubernetes</button>
        </div>
      </header>
      <main class="main">
        <p id="top-label" class="section-label" hidden>Most cited in this corpus</p>
        <p id="status" class="status" hidden></p>
        <p id="error" class="error" hidden></p>
        <ol id="results" class="results"></ol>
        <footer id="footer" class="footer" hidden></footer>
      </main>
      <footer class="site-footer">
        <span class="ranking-info">BM25 &middot; PageRank &middot; dense rerank</span>
        <a href="/about" class="about-link">About this project</a>
        <a href="/static/explore.html" class="explore-link">Explore topics &rarr;</a>
      </footer>
    </div>
    <script src="/static/search.js" defer></script>
  </body>
</html>
