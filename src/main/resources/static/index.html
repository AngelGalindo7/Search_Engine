<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Blog Search</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">Engineering Blog Search</h1>
        <p class="stats-strip" id="stats-strip">loading corpus…</p>
        <form id="search-form" class="search-form" role="search" autocomplete="off">
          <input
            id="search-input"
            type="search"
            class="search-input"
            placeholder="Search engineering blogs"
            autofocus
            spellcheck="false"
          />
        </form>
      </header>
      <main class="main">
        <p id="top-label" class="section-label" hidden>Most cited in our corpus</p>
        <p id="status" class="status" hidden></p>
        <p id="error" class="error" hidden></p>
        <ol id="results" class="results"></ol>
        <footer id="footer" class="footer" hidden></footer>
      </main>
      <footer class="ranking-info">
        corpus@v0.1 &middot; BM25(k1=1.2, b=0.75, &alpha;=0.5) &middot; domain-decay 0.85^k
      </footer>
    </div>
    <script src="/static/search.js" defer></script>
  </body>
</html>
