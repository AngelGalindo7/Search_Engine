<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Blog Search</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">Engineering Blog Search</h1>
        <form id="search-form" class="search-form" role="search" autocomplete="off">
          <input
            id="search-input"
            type="search"
            class="search-input"
            placeholder="Search engineering blogs"
            autofocus
            spellcheck="false"
          />
        </form>
      </header>
      <main class="main">
        <p id="hint" class="hint">Try queries like &laquo;rust async&raquo;, &laquo;kafka&raquo;, or &laquo;distributed tracing&raquo;.</p>
        <p id="status" class="status" hidden></p>
        <p id="error" class="error" hidden></p>
        <ol id="results" class="results"></ol>
        <footer id="footer" class="footer" hidden></footer>
      </main>
    </div>
    <script src="/static/search.js" defer></script>
  </body>
</html>
